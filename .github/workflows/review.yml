name: AI PR Review
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

# Comment commands are intentionally unsupported.
permissions:
  contents: read
  pull-requests: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    uses: vultr/shared-actions/.github/workflows/review.yml@main
    secrets:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      OPENAI__API_BASE: ${{ secrets.OPENAI__API_BASE }}
